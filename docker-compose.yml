services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zbhub
      POSTGRES_PASSWORD: zbhub
      POSTGRES_DB: zbhub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3000:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://zbhub:zbhub@db:5432/zbhub
      DIRECT_URL: postgresql://zbhub:zbhub@db:5432/zbhub

volumes:
  db-data:
