{% extends "base.html" %}

{% block content %}
<div class="auth-card">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email on your account and we'll send you a reset link.</p>

  <form method="post" class="wine-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
  <p class="muted"><a href="{{ url_for('auth.login_page') }}">Back to sign in</a></p>
</div>
{% endblock %}
