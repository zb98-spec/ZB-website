{% extends "base.html" %}

{% block content %}
<div class="auth-card">
  <h1>Create an account</h1>
  <p class="muted">Pick a username and password.</p>

  <form method="post" class="wine-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username" value="{{ username }}" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <label>Confirm password
      <input type="password" name="confirm_password" required minlength="8">
    </label>
    <button type="submit" class="btn btn-primary">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login_page') }}">Sign in</a></p>
</div>
{% endblock %}
